<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f8ff;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 30px;
      color: #333;
    }
    .btn {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.1);
    }
    #personal { background: #ff6347; }   
    #hobbies { background: #32cd32; }    
    #skills { background: #1e90ff; }    
    .content {
      margin-top: 20px;
      padding: 20px;
      display: none;
      font-size: 18px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>About Me</h1>
  <button id="personal" class="btn">Personal Details</button>
  <button id="hobbies" class="btn">Hobbies</button>
  <button id="skills" class="btn">Skills</button>

  <div id="personalContent" class="content">
    <h2>Personal Details</h2>
    <p>Name: Ruchitha</p>
    <p>Age: 19</p>
    <p>City: Hyderabad</p>
  </div>

  <div id="hobbiesContent" class="content">
    <h2>Hobbies</h2>
    <p>📚 Reading books</p>
    <p>🎶 Listening to music</p>
    <p>✈️ Traveling</p>
  </div>

  <div id="skillsContent" class="content">
    <h2>Skills</h2>
    <p>💻 C++ Programming</p>
    <p>🌐 HTML & CSS</p>
    <p>🛠 Problem Solving</p>
  </div>

  <script>
    document.getElementById("personal").onclick = function() {
      hideAll();
      document.getElementById("personalContent").style.display = "block";
    };
    document.getElementById("hobbies").onclick = function() {
      hideAll();
      document.getElementById("hobbiesContent").style.display = "block";
    };
    document.getElementById("skills").onclick = function() {
      hideAll();
      document.getElementById("skillsContent").style.display = "block";
    };

    function hideAll() {
      document.getElementById("personalContent").style.display = "none";
      document.getElementById("hobbiesContent").style.display = "none";
      document.getElementById("skillsContent").style.display = "none";
    }
  </script>
</body>
</html>
